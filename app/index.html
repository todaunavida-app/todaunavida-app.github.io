<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toda una vida</title>
<style>
@font-face{font-family:"Newsreader";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/newsreader-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-weight:400;font-style:italic;font-display:swap;src:url(fonts/newsreader-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Nanum Pen Script";font-weight:400;font-display:swap;src:url(fonts/nanum-pen-script-latin-400-normal.woff2) format("woff2")}
html,body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
.lnk{background:none;border:0;color:#8a857b;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 4px;font-family:var(--sans)}
</style>
<script src="config.js"></script>
<style>
:root{
  --paper:#f4f4f2; --graphite:#262626; --soft:#7d7d79; --line:#d6d6d2; --card:#fbfbfa; --btn:#1e1e1e; --btn-ink:#f7f7f5;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Nanum Pen Script","Segoe Print","Bradley Hand",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161616;--graphite:#e4e4e0;--soft:#8e8e8a;--line:#333331;--card:#1e1e1d;--btn:#ecece8;--btn-ink:#161616}}
:root[data-theme="light"]{--paper:#f4f4f2;--graphite:#262626;--soft:#7d7d79;--line:#d6d6d2;--card:#fbfbfa;--btn:#1e1e1e;--btn-ink:#f7f7f5}
:root[data-theme="dark"]{--paper:#161616;--graphite:#e4e4e0;--soft:#8e8e8a;--line:#333331;--card:#1e1e1d;--btn:#ecece8;--btn-ink:#161616}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--graphite);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,#dial:focus-visible{outline:2px solid var(--graphite);outline-offset:3px}
.hidden{display:none!important}

/* pantalla principal */
#main{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 16px);max-width:520px;margin:0 auto}
#head{text-align:center}
#head .name{font-family:var(--serif);font-size:26px;margin:0;line-height:1.1}
#head .age{font-size:14px;color:var(--soft);margin-top:4px}
#art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#art svg{width:100%;max-width:min(100%,46vh);height:auto;display:block}
#art .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#caption{font-family:var(--hand);font-size:25px;line-height:1.15;text-align:center;min-height:2.4em;margin:0 6px 10px;transition:opacity .8s}
#caption.fade{opacity:0}
#note{font-size:13px;color:var(--soft);text-align:center;min-height:18px;margin-top:-6px;margin-bottom:6px}
.st{fill:none;stroke:var(--graphite);stroke-linecap:round;stroke-linejoin:round}
.st.anim{stroke-dasharray:1;stroke-dashoffset:1;animation-name:draw;animation-timing-function:ease-out;animation-fill-mode:forwards}
.fi{fill:var(--graphite);stroke:none}
.pap{fill:var(--paper);stroke:none}
.pap.anim{opacity:0;animation:appear .3s ease forwards}
.fi.anim,.hand{animation:appear .6s ease forwards}
.fi.anim{opacity:0}
.hand{font-family:var(--hand);font-size:17px;fill:var(--graphite)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes appear{from{opacity:0}to{opacity:1}}
.erasing{animation:erase 1.3s ease-in forwards}
@keyframes erase{0%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 100%);opacity:.2}}

/* controles */
#controls{border-top:1px solid var(--line);padding-top:12px}
.dialwrap{display:flex;justify-content:center}
#dial{width:168px;height:168px;touch-action:none;cursor:grab;border-radius:50%}
#dial text{fill:var(--graphite)}
.btn{display:block;width:100%;font-weight:600;font-size:16px;padding:14px;border-radius:12px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--graphite);border:1px solid var(--line);font-weight:500}
.links{display:flex;justify-content:center;gap:18px;margin-top:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--soft);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
#timer{font-family:var(--serif);font-size:40px;text-align:center;margin:0;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line);margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--graphite)}
.toggles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.tog{font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer}
.tog[aria-pressed=true]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.hint{font-size:13px;color:var(--soft);text-align:center;margin:0}

/* páginas */
.page{position:fixed;inset:0;z-index:5;background:var(--paper);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
.page .in{max-width:520px;margin:0 auto}
h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 6px}
h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:26px 0 8px}
p.sub{margin:0 0 12px;color:var(--soft);font-size:15px;line-height:1.5}
.f{display:block;font-size:14px;color:var(--soft);margin:18px 0 8px}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--graphite)}
textarea{min-height:150px;font-family:var(--serif);font-size:18px;line-height:1.55;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:15px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer}
.chip[aria-pressed=true]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
#preview{max-width:230px;margin:6px auto 0}
#preview svg{width:100%;height:auto;display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sk{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 6px 10px;cursor:pointer;text-align:left}
.sk svg{width:100%;height:auto;display:block}
.sk span{display:block;font-family:var(--hand);font-size:17px;line-height:1.1;margin-top:4px}
.sk small{display:block;font-size:11px;color:var(--soft);margin-top:4px}
.list{list-style:none;padding:0;margin:0}
.list li{border-bottom:1px solid var(--line);padding:12px 0}
.list li button{background:none;border:0;padding:0;cursor:pointer;text-align:left;width:100%}
.list .t{font-family:var(--serif);font-size:19px}
.list .d{font-size:13px;color:var(--soft);margin-top:2px}
.logros li{padding:8px 0;font-size:15px;line-height:1.45}
.logros li::before{content:"✓ ";color:var(--soft)}
.letterbox{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px;font-family:var(--serif);font-size:17px;line-height:1.6;white-space:pre-wrap}

/* carta y visor */
.overlay{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.45)}
.letter{width:100%;max-width:420px;background:#fbfbf9;color:#262626;border-radius:3px;padding:28px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35);transform:translateY(-60vh) rotate(-5deg);opacity:0;transition:transform 2s cubic-bezier(.2,.8,.2,1),opacity 1s}
.letter.in{transform:none;opacity:1}
.letter .who{font-family:var(--hand);font-size:20px;color:#6b6b67;margin-bottom:12px}
.letter .body{font-family:var(--serif);font-size:19px;line-height:1.6;white-space:pre-wrap;max-height:52vh;overflow-y:auto}
.letter .btn{background:#262626;color:#fbfbf9}
.viewer{width:100%;max-width:380px;background:var(--paper);border-radius:4px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.viewer svg{width:100%;height:auto;display:block}
.viewer p{font-family:var(--hand);font-size:23px;line-height:1.15;text-align:center;margin:6px 0 2px}
.viewer small{display:block;text-align:center;color:var(--soft);font-size:13px}
@media (prefers-reduced-motion:reduce){.st.anim{animation:none;stroke-dashoffset:0}.fi.anim{animation:none;opacity:1}.erasing{animation:none;opacity:0}.letter{transition:opacity .3s}}

/* interruptor día / noche */
#theme{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#theme svg{width:20px;height:20px;stroke:var(--graphite);fill:none;stroke-width:1.6;stroke-linecap:round}
/* portada */
#splash{position:fixed;inset:0;z-index:15;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;cursor:pointer;transition:opacity .8s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(92vw,460px);height:auto;overflow:visible}
#splash .t{font-family:var(--hand);font-size:92px;fill:none;stroke:var(--graphite);stroke-width:1.3;stroke-dasharray:900;stroke-dashoffset:900;animation:ink 2.6s ease forwards}
#splash .t2{fill:var(--graphite);opacity:0;animation:appear 1s 2.2s forwards;font-family:var(--hand);font-size:92px}
#splash .u{fill:none;stroke:var(--graphite);stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s 2s ease forwards}
#splash p{margin:8px 0 0;color:var(--soft);font-size:15px;opacity:0;animation:appear 1s 2.6s forwards}
@keyframes ink{to{stroke-dashoffset:0}}
/* pasos */
.steps{display:flex;gap:6px;justify-content:center;margin:0 0 30px}
.steps i{width:22px;height:2px;background:var(--line)}
.steps i.on{background:var(--graphite)}
.q{font-family:var(--serif);font-size:30px;line-height:1.2;margin:0 0 8px;text-align:center}
.qs{color:var(--soft);font-size:15px;text-align:center;margin:0 0 28px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font-size:18px;padding:18px;border-radius:14px;border:1px solid var(--line);background:transparent;cursor:pointer;text-align:left}
.opt small{display:block;font-size:13px;color:var(--soft);margin-top:3px}
.opt[aria-pressed=true]{border-color:var(--graphite);box-shadow:inset 0 0 0 1px var(--graphite)}
.two{flex-direction:row}.two .opt{flex:1;text-align:center;padding:30px 10px;font-size:20px}
.back{background:none;border:0;color:var(--soft);font-size:15px;cursor:pointer;padding:6px 0;margin-bottom:10px}
.page .in.center{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center}
.sign{font-family:var(--hand);font-size:20px;color:var(--soft);margin-top:8px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="pencil" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter></svg>

<button id="theme" aria-label="Cambiar entre modo día y modo noche"></button>
<div id="splash"><svg viewBox="0 0 460 170" aria-label="Toda una vida"><text class="t" x="230" y="100" text-anchor="middle">Toda una vida</text><text class="t2" x="230" y="100" text-anchor="middle">Toda una vida</text><path class="u" pathLength="1" d="M70 122 Q230 108 392 124"/></svg><p id="splashSub">Estudia. Acompaña una vida.</p></div>
<main id="main">
  <header id="head"><p class="name" id="hName"></p><div class="age" id="hAge"></div></header>
  <div id="art"></div>
  <p id="caption"></p>
  <div id="note"></div>
  <section id="controls">
    <div id="homeCtl">
      <div class="dialwrap"><svg id="dial" viewBox="0 0 200 200" role="slider" tabindex="0" aria-label="Duración de la sesión" aria-valuemin="5" aria-valuemax="180"></svg></div>
      <button class="btn" id="startBtn">Empezar a estudiar</button>
      <div class="links"><button class="link" id="openStory">Su historia</button><button class="link" id="openSettings">Ajustes</button><button class="link" id="openMenu">Menú</button></div>
    </div>

      <div class="toggles"><button class="tog" id="musicTog" aria-pressed="true">Música</button><button class="tog" id="wakeTog" aria-pressed="false">Pantalla encendida</button><button class="tog" id="stopBtn">Terminar</button></div>
    </div>
  </section>
</main>

<div class="page hidden" id="page"><div class="in" id="pageIn"></div></div>

<div class="overlay hidden" id="letterWrap"><div class="letter" id="letter"><div class="who" id="lWho"></div><div class="body" id="lBody"></div><button class="btn" id="lClose">Guardar en el corazón</button><div id="lMod" style="display:flex;justify-content:center;gap:14px;margin-top:6px"><button class="lnk" id="lReport">Denunciar esta carta</button><button class="lnk" id="lBlock">No recibir más cartas de esta persona</button></div></div></div>
<div class="overlay hidden" id="writeWrap"><div class="letter in" style="transform:none;opacity:1"><div class="who">Ahora te toca a ti</div><p style="font-family:var(--serif);font-size:16px;line-height:1.5;margin:0 0 12px;color:#555">Escribe algo para otra persona que esté estudiando. Algo que te hubiera gustado leer hoy.</p><textarea id="wText" maxlength="700" placeholder="Querido desconocido…" style="background:#fff;color:#262626;border-color:#ddd"></textarea><div class="sign" id="wSign"></div><label id="wRulesBox" style="display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;color:#555;margin-top:10px;font-family:var(--sans)"><input type="checkbox" id="wRules" style="margin-top:3px"> <span>Acepto las normas: nada de insultos, contenido sexual, datos personales, enlaces ni redes sociales. Las cartas que no las cumplan se eliminan.</span></label><div id="wErr" style="color:#b4543c;font-size:14px;margin-top:8px;font-family:var(--sans)"></div><button class="btn" id="wSend">Enviar mi carta</button><button class="btn ghost" id="wSkip" style="background:transparent;color:#262626;border:1px solid #ccc">Ahora no</button></div></div>
<div class="overlay hidden" id="askWrap" role="alertdialog" aria-modal="true" aria-labelledby="askText"><div class="viewer" style="max-width:340px;padding:24px 22px 18px"><p class="q" style="font-size:22px;margin-bottom:10px">¿Seguro?</p><p class="qs" id="askText" style="margin-bottom:16px"></p><button class="btn" id="askYes"></button><button class="btn ghost" id="askNo">Cancelar</button></div></div>
<div class="overlay hidden" id="viewerWrap"><div class="viewer" id="viewer"></div></div>
<script>
/* ================= historias ================= */
const PERS={tranquilo:'Tranquilo',sonador:'Soñador',valiente:'Valiente',timido:'Tímido',alegre:'Alegre',rebelde:'Rebelde'};
const GOALS={familia:'Formar una familia',arte:'Crear arte',ayudar:'Ayudar a los demás',mundo:'Conocer el mundo',deporte:'Llegar lejos en el deporte',propio:'Crear algo propio'};
const PLACES={mar:'El mar',montana:'La montaña',ciudad:'La ciudad',campo:'El campo'};
const HAIRS={corto:'Corto',largo:'Largo',rizado:'Rizado',coleta:'Coleta'};
const HOURS=[[10,'Corta','10 h'],[25,'Normal','25 h'],[50,'Larga','50 h']];

// Cada objetivo tiene 10 caminos de vida distintos. Cada camino: 4 momentos (≈10, 18, 28 y 45 años).
const ARCS={
familia:[
 [["{n} juega a las casitas y siempre quiere ser quien cuida de todos.","me,kid:a|house"],["{n} cuida de sus hermanos pequeños cada tarde mientras sus padres trabajan.","me,kid:b,kid:c|"],["{n} se ha casado en una boda pequeña, con mucha música y poca prisa.","me,other:p|heart"],["La hija de {n} se ha ido a estudiar fuera. La casa está muy callada.","me|suitcase@room"]],
 [["{n} ha dibujado a toda su familia, incluido el perro que aún no tiene.","me|paper"],["{n} trabaja de camarer‹o|a› los veranos para ayudar en casa.","me|table"],["Ha nacido su primer hijo. {n} lleva tres días sin dormir y nunca ha sido tan feliz.","me,baby:h|@room"],["{n} ha enseñado a su hijo a montar en bici. Ha soltado el sillín sin que se diera cuenta.","me,kid:h|"]],
 [["{n} pasa los domingos en casa de su abuela aprendiendo a cocinar.","me,parent:ab|pot@room"],["{n} ha conocido a su gran amor en una fiesta de pueblo.","me,other:p|notes"],["{n} y su pareja han comprado una casa vieja. La arreglan poco a poco.","me,other:p|house"],["{n} ha adoptado a un niño. Ha tardado años, y ha valido cada día.","me,other:p,kid:ad|heart"]],
 [["{n} ha tenido un hermanito. Lo mira como si fuera un milagro.","me,baby:hm|@room"],["{n} se ha prometido que tendrá una familia que se abrace mucho.","me|heart"],["Gemelos. {n} no sabe si reír o llorar, así que hace las dos cosas.","me,baby:g1,baby:g2|"],["{n} ha reunido a toda la familia en Navidad. Eran veintidós en la mesa.","me,other:p,kid:x|table"]],
 [["{n} cuida de un pájaro herido hasta que puede volver a volar.","me|tree"],["La madre de {n} ha enfermado. {n} ha crecido de golpe cuidándola.","me,parent:m|@room"],["{n} se ha casado con ‹su mejor amiga|su mejor amigo› de la infancia.","me,other:amigo|heart"],["{n} ha perdonado a su hermano después de diez años sin hablarse.","me,other:hb|bench"]],
 [["{n} hace de ‹hermano|hermana› mayor de todos los niños del barrio.","me,kid:v1,kid:v2|ball"],["{n} se ha enamorado en el último año de instituto. Todavía siguen juntos.","me,other:p|heart"],["{n} ha tenido una hija. Tiene sus mismos ojos.","me,baby:h|@room"],["{n} cocina cada domingo para sus hijos, aunque ya vivan lejos.","me|pot@room"]],
 [["{n} ayuda a su abuelo en el huerto y escucha sus historias de cuando era joven.","me,parent:abuelo|tree"],["{n} ha prometido volver a casa cada domingo. Lo está cumpliendo.","me|house"],["{n} ha sido ‹padre|madre› muy joven. Nadie creía que saldría bien. Salió bien.","me,baby:h|"],["El hijo de {n} ha sido padre. {n} ha llorado en silencio en el pasillo del hospital.","me,other:hijo,baby:n|"]],
 [["{n} guarda en una caja todas las cartas de la familia.","me|box"],["{n} se ha mudado a casa de sus abuelos para cuidarlos.","me,parent:ab|house"],["{n} tiene dos hijos y un perro que se come los zapatos.","me,other:p,kid:k1|ball"],["{n} ha celebrado sus bodas de plata bailando la canción del primer día.","me,other:p|notes"]],
 [["{n} dice que quiere ser como su madre cuando sea mayor.","me,parent:m|"],["{n} ha conocido a alguien en un tren. Se han bajado en la misma estación.","me,other:p|suitcase"],["Tres hijos. La casa de {n} es un caos precioso.","me,kid:a,kid:b|@room"],["{n} ha escrito un libro con las recetas y las historias de su familia.","me|books"]],
 [["{n} organiza obras de teatro con sus primos cada verano.","me,kid:pr1,kid:pr2|"],["{n} ha aprendido de sus padres que el amor es quedarse.","me,parent:pd|bench"],["{n} ha acogido a un niño en su casa durante un año. Todavía se visitan.","me,kid:ac|house"],["En el cumpleaños de {n} estaba toda la familia. No faltaba nadie.","me,other:p,kid:n|table"]]
],

  if(t.f){out+=`<path d="${t.d}" class="fi${animate?' anim':''}" style="animation-delay:${d}s"${rot}/>`;continue}
  out+=`<path d="${t.d}" pathLength="1" class="st${animate?' anim':''}" style="stroke-width:${t.w||1.2};opacity:${t.o??.88};animation-delay:${d}s;animation-duration:${dur}s"${rot}/>`;
  if((t.w||0)>=1.3&&(t.o??1)>.6)out+=`<path d="${t.d}" pathLength="1" class="st${animate?' anim':''}" style="stroke-width:.6;opacity:.3;animation-delay:${(+d+.1).toFixed(2)}s;animation-duration:${dur}s" transform="translate(.7 .5)${t.rot?` rotate(${t.rot[0]} ${t.rot[1]} ${t.rot[2]})`:''}"/>`;
 }
 return `<svg viewBox="10 24 280 264" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g filter="url(#pencil)">${out}</g></svg>`;
}

let AC,master,revBuf,bus=null,chan=null,timer,beds=[],step=0,playing=null;
function audioInit(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9*S.vol;master.connect(AC.destination);
 const len=AC.sampleRate*4,b=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}revBuf=b}
// cada canción suena por su propio canal: al cambiar, el anterior se apaga entero (reverberación incluida)
function newBus(){const inp=AC.createGain(),out=AC.createGain(),cv=AC.createConvolver(),wet=AC.createGain(),dry=AC.createGain();cv.buffer=revBuf;wet.gain.value=.55;dry.gain.value=.7;
 inp.connect(dry);dry.connect(out);inp.connect(cv);cv.connect(wet);wet.connect(out);out.connect(master);out.gain.value=0;return {inp,out}}
function setVolume(v){S.vol=v;if(master)master.gain.setTargetAtTime(.9*v,AC.currentTime,.05)}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function piano(m,t,v=.1,dur=4){const f=mtof(m),g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(2400,t);lp.frequency.exponentialRampToValueAtTime(650,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(v*.3,t+.6);g.gain.exponentialRampToValueAtTime(.0004,t+dur);
 [[1,'triangle',1],[2,'sine',.3],[3,'sine',.1]].forEach(([h,ty,a])=>{const o=AC.createOscillator(),og=AC.createGain();o.type=ty;o.frequency.value=f*h;o.detune.value=(Math.random()-.5)*6;og.gain.value=a;o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur+.1)});lp.connect(g);g.connect(bus)}
const ks={};
function guitar(m,t,v=.1){if(!ks[m]){const sr=AC.sampleRate,len=Math.floor(sr*2.4),b=AC.createBuffer(1,len,sr),d=b.getChannelData(0),N=Math.round(sr/mtof(m));for(let i=0;i<N;i++)d[i]=Math.random()*2-1;for(let i=N;i<len;i++)d[i]=(d[i-N]+d[i-N+1])*.4986;ks[m]=b}
 const s=AC.createBufferSource(),g=AC.createGain(),lp=AC.createBiquadFilter();s.buffer=ks[m];lp.type='lowpass';lp.frequency.value=2000;g.gain.value=v;s.connect(lp);lp.connect(g);g.connect(bus);s.start(t)}
function epiano(ms,t,dur,v=.03){ms.forEach(m=>{const o=AC.createOscillator(),g=AC.createGain(),tr=AC.createOscillator(),tg=AC.createGain();o.type='sine';o.frequency.value=mtof(m);tr.frequency.value=4.2;tg.gain.value=v*.3;tr.connect(tg);tg.connect(g.gain);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0004,t+dur);o.connect(g);g.connect(bus);o.start(t);tr.start(t);o.stop(t+dur+.1);tr.stop(t+dur+.1)})}

 mar:{prog:[[41,48,52,57,60],[43,50,55,59,62],[45,52,57,60,64],[38,45,50,53,57]],tempo:420,

 beds.forEach(([s,o])=>{try{s.stop(t+fade+.1);o&&o.stop(t+fade+.1)}catch(e){}});beds=[];chan=null;setTimeout(()=>{try{old.out.disconnect()}catch(e){}},(fade+.3)*1000)}

  const go=()=>{const v=$('nm').value.trim();if(!v)return $('nm').focus();draft.name=v;createStep(2)};$('nmN').onclick=go;$('nm').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>$('nm')?.focus(),300)}
 if(k===2){stepPage(`${dots(5,2)}<p class="q">¿Qué quiere hacer con su vida?</p><p class="qs">Cada objetivo tiene diez caminos distintos. No sabrás cuál le tocará.</p><div class="opts">${Object.entries(GOALS).map(([v,l])=>`<button class="opt" data-v="${v}" aria-pressed="${draft.goal===v}">${l}</button>`).join('')}</div>`,back);
  pick1('.opt',v=>{draft.goal=v;setTimeout(()=>createStep(3),180)})}
 if(k===3){stepPage(`${dots(5,3)}<p class="q">¿Qué música os acompañará?</p><p class="qs">Toca una para escucharla. También marca el lugar donde vivirá.</p><div class="opts">${Object.entries(MUSICS).map(([v,[l,s]])=>`<button class="opt" data-v="${v}" aria-pressed="${draft.place===v}">${l}<small>${s}</small></button>`).join('')}</div><button class="btn${draft.place?'':' hidden'}" id="born">Siguiente</button>`,back);
  pick1('.opt',(v,b)=>{draft.place=v;$('pageIn').querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));preview(v);$('born').classList.remove('hidden')});
  $('born').onclick=()=>{stopMusic();createStep(4)}}
 if(k===4){draft.hours=draft.hours||S.hours;
  stepPage(`${dots(5,4)}<p class="q">Los tiempos</p><p class="qs">Gira la rueda para elegir cuánto durará cada sesión de estudio.</p><div class="dialwrap"><svg id="dial2" viewBox="0 0 200 200" role="slider" tabindex="0" aria-label="Duración de cada sesión" aria-valuemin="5" aria-valuemax="180" style="width:190px;height:190px;touch-action:none;cursor:grab;border-radius:50%"></svg></div>
  <p class="qs" style="margin:26px 0 12px">¿Y cuántas horas de estudio durará su vida entera?</p><div class="opts two" id="hrs2">${HOURS.map(([h,l,d])=>`<button class="opt" data-v="${h}" aria-pressed="${h===draft.hours}" style="padding:16px 6px;font-size:17px">${l}<small>${d}</small></button>`).join('')}</div>
  <button class="btn" id="go">Empezar su vida</button>`,back);
  const d2=$('dial2');drawDial(d2);bindDial(d2);
  $('hrs2').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;draft.hours=+b.dataset.v;$('hrs2').querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('go').onclick=()=>{const P=Object.keys(PERS);S.hours=draft.hours;
   const L=Object.assign({},draft,{pers:P[Math.floor(Math.random()*P.length)],beard:draft.gender==='m'&&Math.random()<.45,studied:0,sessions:0,lived:[],finalAge:82+Math.floor(Math.random()*11),born:Date.now()});
   L.story=buildStory(L);S.life=L;S.session=null;draft={};save();cont()}}
}
function createPage(){draft={};createStep(0)}
function thumbs(L,idxs){return `<div class="grid">${idxs.map(i=>{const e=L.story[i];return `<button class="sk" data-i="${i}">${sketchSVG(e,L,false)}<span>${esc(e.text)}</span><small>${ageLabel(e.age)}${e.logro?', logro':''}</small></button>`}).join('')}</div>`}
function bindThumbs(L){$('pageIn').querySelectorAll('.sk').forEach(b=>b.onclick=()=>{const e=L.story[+b.dataset.i];$('viewer').innerHTML=`${sketchSVG(e,L,true)}<p>${esc(e.text)}</p><small>${ageLabel(e.age)}</small><button class="btn" id="vc">Cerrar</button>`;$('viewerWrap').classList.remove('hidden');$('vc').onclick=()=>$('viewerWrap').classList.add('hidden')})}
$('viewerWrap').onclick=e=>{if(e.target.id==='viewerWrap')$('viewerWrap').classList.add('hidden')};
$('openStory').onclick=()=>{const L=S.life;openPage(`<h2>La historia de ${esc(L.name)}</h2><p class="sub">Su objetivo: ${GOALS[L.goal].toLowerCase()}.</p>${thumbs(L,[...L.lived].reverse())}<button class="btn ghost" id="bk">Volver</button>`);bindThumbs(L);$('bk').onclick=closePage};
$('openMenu').onclick=menu;
function livesPage(){openPage(`<h2>Vidas anteriores</h2><p class="sub">Cada vida que acompañas hasta el final se queda aquí, con su historia, sus logros y la carta que escribiste.</p>${S.lives.length?`<ul class="list">${S.lives.map((l,i)=>`<li><button data-l="${i}"><div class="t">${esc(l.name)}</div><div class="d">${GOALS[l.goal]}. Vivió ${l.finalAge} años, ${l.hrs} h de estudio juntos.</div></button></li>`).join('')}</ul>`:`<p class="sub">Todavía no has acompañado ninguna vida completa${S.life?`. ${esc(S.life.name)} será la primera`:''}.</p>`}${S.outbox.length?`<h3>Cartas que has enviado</h3>${S.outbox.map(l=>`<div class="letterbox" style="margin-bottom:10px">${esc(l.text)}\n\n— ${esc(l.from)}</div>`).join('')}`:''}<button class="btn ghost" id="bk">Volver</button>`);
 $('bk').onclick=back;$('pageIn').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>lifePage(S.lives[+b.dataset.l]))}
function lifePage(L){const lg=L.story.filter(e=>e.logro);
 openPage(`<h2>${esc(L.name)}</h2><p class="sub">${GOALS[L.goal]}. Personalidad: ${PERS[L.pers].toLowerCase()}. Vivió ${L.finalAge} años. Estudiasteis juntos ${L.hrs} horas en ${L.sessions} sesiones.</p>
 <h3>Sus logros</h3><ul class="list logros">${lg.map(e=>`<li>${esc(e.text)}</li>`).join('')}</ul>
 <h3>Su vida, en bocetos</h3>${thumbs(L,L.story.map((e,i)=>i))}
 ${L.letter?`<h3>La carta que dejaste</h3><div class="letterbox">${esc(L.letter.text)}\n\n— ${esc(L.letter.from)}</div>`:''}
 <button class="btn ghost" id="bk">Volver a mis vidas</button>`);bindThumbs(L);$('bk').onclick=livesPage}
function settingsPage(){
 const row=(id,label,sub,on)=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)"><div><div style="font-size:16px">${label}</div>${sub?`<div style="font-size:13px;color:var(--soft);margin-top:2px">${sub}</div>`:''}</div><button class="tog" id="${id}" aria-pressed="${on}" style="min-width:74px">${on?'Sí':'No'}</button></div>`;
 openPage(`<h2>Ajustes</h2>
 <h3>Sonido</h3>
 <label class="f" for="vol" style="margin-top:4px">Volumen: <span id="volV">${Math.round(S.vol*100)}%</span></label>
 <input type="range" id="vol" min="0" max="100" step="1" value="${Math.round(S.vol*100)}" style="width:100%;accent-color:var(--graphite)">
 ${row('tMusic','Música durante las sesiones','La banda sonora de su lugar',S.musicOn)}
 ${row('tChime','Aviso al terminar la sesión','Una campanita suave',S.chime)}
 <h3>Sesiones</h3>
 <span class="f" style="margin-top:4px">Cómo pasa el tiempo</span>
 <div class="chips" id="spd">${[[1,'Tiempo real'],[60,'Rápido (1 min = 1 h)'],[600,'Muy rápido']].map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${v===S.speed}">${l}</button>`).join('')}</div>
 <p class="sub" style="margin-top:8px">Lo normal es tiempo real. Los modos rápidos sirven para probar la app y ver una vida entera en pocos minutos.</p>
 ${row('tWake','Pantalla siempre encendida','Durante las sesiones, para ver cómo crece',S.autoWake)}
 ${row('tNight','Modo noche','También puedes cambiarlo con el botón de arriba',document.documentElement.getAttribute('data-theme')==='dark')}
 <h3>Tus datos</h3>
 <p class="sub" style="margin:0 0 8px">${esc(S.me.name)}, ${S.me.age} años, ${esc(S.me.city)}. Tus cartas se firman como «Alguien de ${esc(S.me.city)}, ${S.me.age} años».</p>
 <button class="btn ghost" id="ed" style="margin-top:0">Cambiar mis datos</button>
 ${S.life?`<button class="btn ghost" id="rs">Despedirme de ${esc(S.life.name)} sin terminar su vida</button>`:''}
 <h3>Información</h3>
 <p class="sub" style="margin:0 0 8px">Las cartas son anónimas: solo se envía tu ciudad y tu edad. Tu nombre no sale nunca del móvil.</p>
 <button class="btn ghost" id="priv" style="margin-top:0">Privacidad y normas de las cartas</button>
 <p class="sub" style="margin-top:10px">Contacto: ${esc((window.APP_CONFIG||{}).contactEmail||'')}</p>
 <button class="btn ghost" id="wipe" style="color:#d2694f;border-color:#d2694f">Borrar todo y empezar de cero</button>
 <button class="btn" id="bk" style="margin-top:22px">Volver</button>`);
 const tog=(id,get,set)=>$(id).onclick=()=>{const v=!get();set(v);save();$(id).setAttribute('aria-pressed',v);$(id).textContent=v?'Sí':'No'};
 $('vol').oninput=e=>{setVolume(e.target.value/100);$('volV').textContent=e.target.value+'%'};$('vol').onchange=save;
 tog('tMusic',()=>S.musicOn,v=>{S.musicOn=v;if(!v)stopMusic();else if(S.session&&S.life)startMusic(S.life.place)});
 tog('tChime',()=>S.chime,v=>{S.chime=v;if(v)chime()});
 tog('tWake',()=>S.autoWake,v=>{S.autoWake=v;if(S.session)setWake(v)});
 tog('tNight',()=>document.documentElement.getAttribute('data-theme')==='dark',v=>{S.theme=v?'dark':'light';applyTheme()});
 $('spd').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;S.speed=+b.dataset.v;save();$('spd').querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b))};
 $('ed').onclick=()=>{reg=Object.assign({},S.me);register(0)};
 if(S.life)$('rs').onclick=()=>ask(`${S.life.name} no terminará su vida y no se guardará en «Vidas anteriores».`,`Despedirme de ${S.life.name}`,()=>{endLife();menu()});
 $('wipe').onclick=()=>ask('Se borrarán tus datos, la vida actual, todas tus vidas anteriores y las cartas que has escrito. No se puede deshacer.','Borrar todo',()=>{endLife();try{localStorage.removeItem(KEY)}catch(e){}location.reload()});
 $('priv').onclick=()=>{location.href='privacidad.html'};
 $('bk').onclick=back}
$('openSettings').onclick=settingsPage;

/* ================= sesiones ================= */
function goHome(){$('homeCtl').classList.remove('hidden');$('sessCtl').classList.add('hidden');drawDial()}
$('startBtn').onclick=()=>{S.session={start:Date.now(),dur:S.dur*60000};save();$('homeCtl').classList.add('hidden');$('sessCtl').classList.remove('hidden');$('musicTog').setAttribute('aria-pressed',S.musicOn);startMusic(S.life.place);if(S.autoWake)setWake(true);upd()};
$('stopBtn').onclick=()=>finish(false);
function upd(){if(!S.session)return;const el=sessEl(),left=Math.max(0,S.session.dur-el),s=Math.ceil(left/1000/S.speed)||0,h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=v=>String(v).padStart(2,'0');
 $('timer').textContent=h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`;$('sBar').style.width=(el/S.session.dur*100)+'%';
 if(lifeMs()>=S.life.hours*3600000)return finish(true);if(el>=S.session.dur)finish(true)}
function finish(done){if(!S.session)return;if(done)chime();const el=sessEl();S.life.studied=Math.min(S.life.studied+el,S.life.hours*3600000);S.life.sessions++;S.session=null;save();stopMusic();setWake(false);refresh();
 if(S.life.studied>=S.life.hours*3600000)return setTimeout(farewell,1500);
 goHome();if(done)setTimeout(giveLetter,1200)}

/* ================= cartas ================= */
/* ================= cartas entre usuarios (Supabase) ================= */
if(!S.device){S.device=(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g,()=>(Math.random()*16|0).toString(16)));save()}
S.seenRemote=S.seenRemote||[];S.blocked=S.blocked||[];S.pending=S.pending||[];
const API=window.APP_CONFIG||{},online=!!(API.supabaseUrl&&API.supabaseKey&&!API.supabaseUrl.includes('PEGA_AQUI'));
async function sb(path,body,prefer){const r=await fetch(API.supabaseUrl.replace(/\/$/,'')+'/rest/v1/'+path,{method:'POST',headers:Object.assign({'Content-Type':'application/json',apikey:API.supabaseKey,Prefer:prefer||'return=minimal'},API.supabaseKey.startsWith('eyJ')?{Authorization:'Bearer '+API.supabaseKey}:{}),body:JSON.stringify(body)});
 if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}throw new Error(m||('HTTP '+r.status))}const t=await r.text();return t?JSON.parse(t):null}
let current=null;
function showLetter(from,body){$('lWho').textContent='De: '+from;$('lBody').textContent=body;$('lMod').style.display=current?'flex':'none';$('lReport').textContent='Denunciar esta carta';
 $('letterWrap').classList.remove('hidden');const l=$('letter');l.classList.remove('in');requestAnimationFrame(()=>requestAnimationFrame(()=>l.classList.add('in')))}
function localLetter(){let pool=LETTERS.map((l,i)=>i).filter(i=>!S.seen.includes(i));if(!pool.length){S.seen=[];pool=LETTERS.map((l,i)=>i)}const i=pool[Math.floor(Math.random()*pool.length)];S.seen.push(i);save();current=null;showLetter(LETTERS[i][0],LETTERS[i][1])}
async function giveLetter(){
 if(online){try{const r=await sb('rpc/random_letter',{p_author:S.device,p_seen:S.seenRemote.slice(-500),p_blocked:S.blocked},'return=representation');
  if(r&&r.length){const x=r[0];current=x;S.seenRemote.push(x.id);save();return showLetter(`Alguien de ${x.city}, ${x.age} años`,x.body)}}catch(e){}}
 localLetter()}
$('lReport').onclick=async()=>{if(!current)return;try{await sb('rpc/report_letter',{p_id:current.id})}catch(e){}$('lReport').textContent='Gracias, la revisaremos'};
$('lBlock').onclick=()=>{if(!current)return;if(!S.blocked.includes(current.author))S.blocked.push(current.author);save();$('letterWrap').classList.add('hidden');$('note').textContent='No volverás a recibir cartas de esa persona.'};
const signature=()=>`Alguien de ${S.me.city}, ${S.me.age} años`;
$('lClose').onclick=()=>{$('letterWrap').classList.add('hidden');openWrite()};
function openWrite(){$('wText').value='';$('wErr').textContent='';$('wSign').textContent='Firmará: '+signature();$('wRulesBox').style.display=S.rulesOk?'none':'flex';$('wRules').checked=!!S.rulesOk;$('writeWrap').classList.remove('hidden')}
$('wSkip').onclick=()=>$('writeWrap').classList.add('hidden');
const BAD=/(https?:\/\/|www\.|\.com|@|instagram|tiktok|whatsapp|telegram|discord|snapchat|(\d[\s.\-]*){7,})/i;
async function sendLetter(l){await sb('letters',{author:S.device,body:l.text,city:S.me.city,age:S.me.age})}
$('wSend').onclick=async()=>{const t=$('wText').value.trim();$('wErr').textContent='';
 if(t.length<10){$('wErr').textContent='Escribe al menos una frase.';return $('wText').focus()}
 if(!S.rulesOk&&!$('wRules').checked){$('wErr').textContent='Tienes que aceptar las normas para enviarla.';return}
 if(BAD.test(t)){$('wErr').textContent='Las cartas no pueden llevar enlaces, redes sociales, correos ni teléfonos.';return}
 S.rulesOk=true;const l={text:t,from:signature(),at:Date.now()};$('wSend').disabled=true;
 try{if(online)await sendLetter(l);else S.pending.push(l)}catch(e){if(/limite_diario/.test(e.message)){$('wErr').textContent='Ya has enviado 5 cartas hoy. Mañana podrás escribir más.';$('wSend').disabled=false;return}S.pending.push(l)}
 $('wSend').disabled=false;S.outbox.unshift(l);save();$('writeWrap').classList.add('hidden');$('note').textContent='Tu carta ya está en camino.';setTimeout(()=>{if($('note').textContent==='Tu carta ya está en camino.')$('note').textContent=''},6000)};
async function flushPending(){if(!online||!S.pending.length)return;const q=[...S.pending];S.pending=[];for(const l of q){try{await sendLetter(l)}catch(e){if(!/limite_diario/.test(e.message))S.pending.push(l)}}save()}
setTimeout(flushPending,3000);

/* ================= final de la vida ================= */
function farewell(){const L=S.life;L.hrs=fmtHrs(L.studied);const lg=L.story.filter(e=>e.logro);
 openPage(`<h2>${esc(L.name)} se ha despedido</h2><p class="sub">Vivió ${L.finalAge} años. Estuviste a su lado ${L.hrs} horas, en ${L.sessions} ${L.sessions===1?'sesión':'sesiones'}.</p>
 <div id="preview">${sketchSVG({age:L.finalAge,draw:'me|bench@place',text:'fin'},L,true)}</div>
 <h3>Lo que consiguió</h3><ul class="list logros">${lg.map(e=>`<li>${esc(e.text)}</li>`).join('')}</ul>
 <button class="btn" id="keep">Guardar su vida</button>`);
 $('keep').onclick=()=>{L.end=Date.now();S.lives.unshift(L);S.life=null;save();$('art').innerHTML='';shownIdx=-1;
  openPage(`<div class="in center" style="padding:0"><p class="q">Gracias por acompañar a ${esc(L.name)}</p><p class="qs">Su vida, sus bocetos y sus logros están guardados en «Vidas anteriores».</p><button class="btn" id="nl">Volver al menú</button></div>`);$('nl').onclick=menu}}

/* ================= tema día / noche ================= */
const ICON={sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',moon:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'};
function applyTheme(){const dark=S.theme?S.theme==='dark':true;document.documentElement.setAttribute('data-theme',dark?'dark':'light');$('theme').innerHTML=dark?ICON.sun:ICON.moon;$('theme').setAttribute('aria-label',dark?'Cambiar a modo día':'Cambiar a modo noche')}
$('theme').onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark';S.theme=dark?'light':'dark';save();applyTheme()};
applyTheme();

/* ================= arranque ================= */
function enter(){const sp=$('splash');if(!sp||sp.classList.contains('out'))return;sp.classList.add('out');setTimeout(()=>sp.remove(),900);
 if(!S.me)return register(0);
 if(S.life&&S.session)return cont();
 menu()}
if(S.me)$('splashSub').textContent=`Hola, ${S.me.name}. Toca para entrar.`;
$('splash').onclick=enter;
const fitTitle=()=>{try{document.querySelectorAll('#splash text').forEach(t=>{const w=t.getComputedTextLength();if(w>420)t.style.fontSize=(92*420/w)+'px'})}catch(e){}};fitTitle();document.fonts&&document.fonts.ready.then(fitTitle);
setTimeout(enter,S.me?4200:5200);
setInterval(()=>{if(S.life&&S.session){refresh();upd()}},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.life){refresh(true);if(S.session){upd();if(AC&&playing)AC.resume()}if($('wakeTog').getAttribute('aria-pressed')==='true')setWake(true)}});
</script>
</body>
</html>
